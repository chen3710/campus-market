<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品详情 · 校园二手交易平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <div id="pageContent">
        <div class="empty"><div class="fs-13">加载中…</div></div>
    </div>
</main>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
    const productId = queryParam('id');
    let product = null;
    let activeImage = 0;

    renderNav('index');

    /* ------------------------------ 渲染 ------------------------------ */

    function galleryHtml() {
        const images = (product.images && product.images.length)
            ? product.images
            : (product.cover ? [product.cover] : []);

        if (!images.length) {
            return '<div class="gallery-main" style="' + coverStyle(product.id) + '">'
                + '<span class="cover-placeholder" style="font-size:64px">'
                + escapeHtml(firstChar(product.title)) + '</span></div>';
        }

        const main = '<div class="gallery-main"><img id="mainImage" src="'
            + escapeHtml(images[activeImage]) + '" alt="' + escapeHtml(product.title) + '"></div>';

        if (images.length === 1) return main;

        const thumbs = '<div class="gallery-thumbs">' + images.map((url, index) =>
            '<div class="thumb' + (index === activeImage ? ' active' : '') + '" data-index="' + index + '">'
            + '<img src="' + escapeHtml(url) + '" alt=""></div>').join('') + '</div>';

        return main + thumbs;
    }

    function actionButtonsHtml() {
        const me = Auth.user();

        if (product.mine) {
            let buttons = '<a class="btn btn-block" href="publish.html?id=' + product.id + '">编辑商品</a>';
            if (product.status === 'ON_SALE') {
                buttons += '<button class="btn btn-block mt-8" data-action="off-shelf">下架商品</button>';
            } else if (product.status === 'OFF_SHELF') {
                buttons += '<button class="btn btn-block mt-8" data-action="on-shelf">重新上架</button>';
            }
            if (product.status !== 'LOCKED') {
                buttons += '<button class="btn btn-danger btn-block mt-8" data-action="remove">删除商品</button>';
            }
            return buttons;
        }

        if (product.status === 'ON_SALE') {
            return '<button class="btn btn-primary btn-block" data-action="order">立即下单</button>';
        }
        return '<button class="btn btn-primary btn-block" disabled>'
            + escapeHtml((PRODUCT_STATUS[product.status] || {}).text || '不可购买') + '</button>';
    }

    function render() {
        const favoriteText = product.favorited ? '已收藏' : '收藏';
        const originPrice = product.originalPrice
            ? '<span class="price-origin">原价 ¥' + formatMoney(product.originalPrice) + '</span>'
            : '';
        const discount = (product.originalPrice && Number(product.originalPrice) > 0)
            ? Math.round(Number(product.price) / Number(product.originalPrice) * 100) / 10 + ' 折'
            : '';

        $('#pageContent').innerHTML =
            '<div class="row fs-13 text-3" style="margin-bottom:14px">'
            + '<a href="index.html" class="text-primary">← 返回市场</a>'
            + '<span>·</span><span>' + escapeHtml(product.categoryName || '未分类') + '</span>'
            + '</div>'

            + '<div class="detail-layout">'

            /* 左侧 */
            + '<div class="stack">'
            + '<div class="card card-pad">'
            + galleryHtml()
            + '<h1 style="font-size:19px;font-weight:600;margin:18px 0 0;line-height:1.5">'
            + escapeHtml(product.title) + '</h1>'
            + '<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">'
            + productStatusBadge(product.status)
            + '<span class="chip">' + escapeHtml(product.conditionLevel || '成色未标注') + '</span>'
            + '<span class="chip">' + (product.viewCount || 0) + ' 浏览</span>'
            + '<span class="chip">' + (product.favoriteCount || 0) + ' 收藏</span>'
            + '</div>'
            + '</div>'

            + '<div class="card card-pad">'
            + '<div class="card-title" style="margin-bottom:12px">商品描述</div>'
            + '<div style="white-space:pre-wrap;line-height:1.75;color:#374151">'
            + escapeHtml(product.description || '卖家没有填写详细描述') + '</div>'
            + '</div>'

            + '<div class="card">'
            + '<div class="card-head"><span class="card-title">商品留言</span>'
            + '<span class="fs-13 text-3" id="commentCount"></span></div>'
            + '<div class="card-pad" style="padding-top:6px">'
            + '<div id="comments"></div>'
            + '<div id="commentForm" class="mt-16 hidden">'
            + '<textarea class="textarea" id="commentInput" maxlength="500" placeholder="想问点什么？比如能否小刀、什么时候方便面交…"></textarea>'
            + '<div class="row-between mt-8">'
            + '<span class="fs-12 text-3">友善交流，最多 500 字</span>'
            + '<button class="btn btn-sm btn-primary" id="submitComment">发表留言</button>'
            + '</div></div>'
            + '<div id="commentLoginTip" class="mt-16 fs-13 text-3"></div>'
            + '</div></div>'
            + '</div>'

            /* 右侧 */
            + '<aside class="stack">'
            + '<div class="card card-pad">'
            + '<div class="price-panel">'
            + '<div class="row" style="align-items:baseline">'
            + '<span class="price" style="font-size:30px">' + formatMoney(product.price) + '</span>'
            + originPrice + '</div>'
            + (discount ? '<div class="fs-12 text-primary mt-8">相当于 ' + discount + '</div>' : '')
            + '</div>'

            + '<div class="seller-box">'
            + '<span class="avatar avatar-lg">'
            + (product.sellerAvatar
                ? '<img src="' + escapeHtml(product.sellerAvatar) + '" alt="">'
                : escapeHtml(firstChar(product.sellerNickname)))
            + '</span>'
            + '<div style="flex:1;min-width:0">'
            + '<div class="fw-500">' + escapeHtml(product.sellerNickname || '匿名同学') + '</div>'
            + '<div class="fs-12 text-3">'
            + escapeHtml(product.sellerCampus || '未填写校区')
            + ' · 信用分 ' + (product.sellerCreditScore == null ? '—' : product.sellerCreditScore)
            + '</div></div></div>'

            + '<div class="spec-row"><span class="spec-key">成色</span><span class="spec-val">'
            + escapeHtml(product.conditionLevel || '—') + '</span></div>'
            + '<div class="spec-row"><span class="spec-key">分类</span><span class="spec-val">'
            + escapeHtml(product.categoryName || '—') + '</span></div>'
            + '<div class="spec-row"><span class="spec-key">发布</span><span class="spec-val">'
            + escapeHtml(formatTime(product.createTime)) + '</span></div>'

            + '<div class="mt-16">' + actionButtonsHtml() + '</div>'
            + '<button class="btn btn-block mt-8" data-action="favorite">' + favoriteText + '</button>'
            + '</div>'

            + '<div class="card card-pad fs-13 text-2" style="line-height:1.9">'
            + '<div class="fw-500 text-1" style="color:var(--text);margin-bottom:6px">交易提示</div>'
            + '· 建议约在图书馆、宿舍楼下等人多的地方面交<br>'
            + '· 当面验货再确认完成，平台不介入线下付款<br>'
            + '· 卖家确认后买家取消订单会扣信用分'
            + '</div>'
            + '</aside>'
            + '</div>';

        bindActions();
    }

    /* ------------------------------ 交互 ------------------------------ */

    function bindActions() {
        $$('.thumb').forEach(thumb => {
            thumb.addEventListener('click', () => {
                activeImage = Number(thumb.dataset.index);
                $('#mainImage').src = product.images[activeImage];
                $$('.thumb').forEach(t => t.classList.remove('active'));
                thumb.classList.add('active');
            });
        });

        const handler = {
            order: openOrderModal,
            favorite: toggleFavorite,
            'off-shelf': () => changeShelf(false),
            'on-shelf': () => changeShelf(true),
            remove: removeProduct
        };

        $$('[data-action]').forEach(btn => {
            btn.addEventListener('click', () => {
                const fn = handler[btn.dataset.action];
                if (fn) fn();
            });
        });
    }

    async function toggleFavorite() {
        if (!requireLogin()) return;
        try {
            const { data, message } = await FavoriteApi.toggle(product.id);
            product.favorited = data;
            product.favoriteCount = (product.favoriteCount || 0) + (data ? 1 : -1);
            toast(message, 'success');
            render();
        } catch (e) { /* 错误已由 request 统一提示 */ }
    }

    async function changeShelf(onShelf) {
        try {
            const { message } = onShelf
                ? await ProductApi.onShelf(product.id)
                : await ProductApi.offShelf(product.id);
            toast(message, 'success');
            load();
        } catch (e) { /* ignore */ }
    }

    function removeProduct() {
        confirmDialog('删除商品', '删除后无法恢复，确定要删除「' + product.title + '」吗？', async () => {
            try {
                const { message } = await ProductApi.remove(product.id);
                toast(message, 'success');
                setTimeout(() => { location.href = 'center.html?tab=products'; }, 600);
            } catch (e) { /* ignore */ }
        });
    }

    function openOrderModal() {
        if (!requireLogin()) return;

        const me = Auth.user();
        openModal({
            title: '确认下单',
            bodyHtml:
                '<div class="card" style="box-shadow:none;background:#fafbfc;padding:12px;margin-bottom:16px">'
                + '<div class="fw-500 ellipsis">' + escapeHtml(product.title) + '</div>'
                + '<div class="row mt-8" style="align-items:baseline">'
                + '<span class="price">' + formatMoney(product.price) + '</span></div>'
                + '</div>'
                + '<div class="field"><label class="label">联系方式</label>'
                + '<input class="input" id="orderContact" value="'
                + escapeHtml(me.phone || '') + '" placeholder="微信 / 手机号，方便卖家联系你"></div>'
                + '<div class="field" style="margin-bottom:0"><label class="label">给卖家留言</label>'
                + '<textarea class="textarea" id="orderRemark" style="min-height:70px" '
                + 'placeholder="例如：今晚 7 点图书馆门口方便面交吗？"></textarea></div>',
            confirmText: '确认下单',
            onConfirm: async () => {
                const { message } = await OrderApi.create({
                    productId: product.id,
                    contact: ($('#orderContact') || {}).value || '',
                    remark: ($('#orderRemark') || {}).value || ''
                });
                toast(message || '下单成功', 'success');
                setTimeout(() => { location.href = 'center.html?tab=bought'; }, 700);
            }
        });
    }

    /* ------------------------------ 留言 ------------------------------ */

    async function loadComments() {
        const box = $('#comments');
        try {
            const { data } = await CommentApi.list(product.id);
            $('#commentCount').textContent = data.length ? data.length + ' 条' : '';
            box.innerHTML = data.length
                ? data.map(commentHtml).join('')
                : '<div class="fs-13 text-3" style="padding:16px 0">还没有人留言，来问第一个问题吧</div>';
        } catch (e) {
            box.innerHTML = '';
        }

        if (Auth.isLogin()) {
            $('#commentForm').classList.remove('hidden');
        } else {
            $('#commentLoginTip').innerHTML = '<a href="login.html?redirect='
                + encodeURIComponent('detail.html?id=' + product.id) + '" class="text-primary">登录</a> 后可以留言';
        }
    }

    function commentHtml(comment) {
        const avatar = comment.userAvatar
            ? '<img src="' + escapeHtml(comment.userAvatar) + '" alt="">'
            : escapeHtml(firstChar(comment.userNickname));
        return '<div class="comment">'
            + '<span class="avatar">' + avatar + '</span>'
            + '<div class="comment-body">'
            + '<div class="comment-head"><span class="comment-name">'
            + escapeHtml(comment.userNickname || '匿名同学') + '</span>'
            + '<span class="comment-time">' + escapeHtml(formatTime(comment.createTime)) + '</span></div>'
            + '<div class="comment-text">' + escapeHtml(comment.content) + '</div>'
            + '</div></div>';
    }

    document.addEventListener('click', async e => {
        if (e.target.id !== 'submitComment') return;
        const input = $('#commentInput');
        const content = input.value.trim();
        if (!content) { toast('请先输入留言内容', 'error'); return; }

        e.target.disabled = true;
        try {
            const { message } = await CommentApi.create(product.id, content);
            toast(message || '留言成功', 'success');
            input.value = '';
            loadComments();
        } catch (e2) { /* ignore */ } finally {
            e.target.disabled = false;
        }
    });

    /* ------------------------------ 启动 ------------------------------ */

    async function load() {
        if (!productId) { location.href = 'index.html'; return; }
        try {
            const { data } = await ProductApi.detail(productId);
            product = data;
            render();
            loadComments();
            document.title = data.title + ' · 校园二手交易平台';
        } catch (e) {
            $('#pageContent').innerHTML = emptyHtml('商品不存在或已被删除', '它可能已经被卖家下架了');
        }
    }

    load();
</script>
</body>
</html>
